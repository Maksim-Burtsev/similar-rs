name: wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64, manylinux: "2_28" }
          - { os: macos-14, arch: arm64, target: aarch64-apple-darwin, manylinux: auto }
          - { os: macos-14, arch: x86_64, target: x86_64-apple-darwin, manylinux: auto }
          - { os: windows-2022, arch: AMD64, target: "", manylinux: auto }
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # abi3-py39: one wheel per platform covers CPython 3.9+.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}

      # macos-14 runners are arm64, so an x86_64 wheel cannot run there.
      - name: Install the wheel and run tests
        if: ${{ !(matrix.os == 'macos-14' && matrix.arch == 'x86_64') }}
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest hypothesis
          python -m pytest tests

      # The wheel claims abi3-py39, so test the floor too. One runner is enough:
      # the abi3 boundary is per-interpreter, not per-platform.
      - uses: actions/setup-python@v6
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        with:
          python-version: "3.9"

      - name: Install the wheel and run tests on Python 3.9
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest hypothesis
          python -m pytest tests

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Install from sdist and run tests
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/pip install pytest hypothesis
          /tmp/sdist-venv/bin/python -m pytest tests

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --generate-notes ||
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
